name: KacamakSUP
options:
  bundleIdPrefix: com.kacamak
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

# Secrets.xcconfig gerçek değerleri sağlar (DEVELOPMENT_TEAM, STRAVA_CLIENT_ID/SECRET).
# Yerelde: `cp Secrets.xcconfig.example Secrets.xcconfig` ile doldurun (git'e commit'lenmez).
# CI'da: fastlane/GitHub Actions bu dosyayı secrets'tan üretir (bkz. README "TestFlight" bölümü).
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
    CODE_SIGN_STYLE: Automatic

targets:
  KacamakSUPWatch:
    type: application.watchapp2
    platform: watchOS
    bundleIdPrefix: com.kacamak
    sources:
      - path: Shared
      - path: WatchApp
        excludes:
          - "Info.plist"
          - "KacamakSUPWatch.entitlements"
    info:
      path: WatchApp/Info.plist
    entitlements:
      path: WatchApp/KacamakSUPWatch.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kacamak.suptakip.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SDKROOT: watchos
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        ENABLE_PREVIEWS: YES

  KacamakSUP:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
        excludes:
          - "Info.plist"
          - "KacamakSUP.entitlements"
    info:
      path: iOS/Info.plist
    entitlements:
      path: iOS/KacamakSUP.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kacamak.suptakip
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_PREVIEWS: YES
    dependencies:
      - target: KacamakSUPWatch
        embed: true
